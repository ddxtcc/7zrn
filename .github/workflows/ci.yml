name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils clang cmake desktop-file-utils file gzip bzip2 xz-utils zstd \
            pkg-config libclang-dev libssl-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols libvulkan-dev libfontconfig1-dev \
            libfreetype6-dev libx11-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libegl1-mesa-dev libgl1-mesa-dev 7zip tar
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: desktop-file-validate packaging/7zrn.desktop
      - run: sh -n packaging/*.sh

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils clang cmake pkg-config libclang-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols \
            libvulkan-dev libfontconfig1-dev libfreetype6-dev libx11-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libegl1-mesa-dev libgl1-mesa-dev \
            curl desktop-file-utils dpkg file patchelf rpm
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: sh packaging/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sevenzrn-linux-x86_64
          path: dist
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sevenzrn-linux-x86_64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "7zrn $tag" --generate-notes
          fi
