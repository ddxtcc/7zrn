[package]
name = "sevenzrn"
version = "0.5.0"
edition = "2024"
description = "7zrn - a native GPUI archive manager for Linux, powered by the 7-Zip and tar CLIs"

[dependencies]
crc32fast = "1"
gpui = "0.2.2"
image = "0.25"
libc = "0.2.190"
md-5 = "0.10"
pulldown-cmark = "0.13.6"
sha1 = "0.10"
sha2 = "0.10"

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
