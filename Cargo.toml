[package]
name = "sevenzrn"
version = "0.1.0"
edition = "2024"
description = "7zrn - a native GPUI archive manager for Linux, powered by the 7-Zip and tar CLIs"

[dependencies]
gpui = "0.2.2"
libc = "0.2.190"

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
